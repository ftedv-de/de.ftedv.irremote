<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body class="homey-widget-full">
  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="pair.create_title"></legend>
    <div class="homey-form-group">
      <label class="homey-form-label" for="name" data-i18n="pair.name"></label>
      <input class="homey-form-input" id="name" type="text" maxlength="80">
    </div>
  </fieldset>
  <button class="homey-button-primary-full" id="create" data-i18n="pair.create"></button>

  <script>
    document.getElementById('create').addEventListener('click', async function () {
      try {
        Homey.showLoadingOverlay();
        const device = await Homey.emit('create_remote', {
          name: document.getElementById('name').value,
        });
        await Homey.createDevice(device);
        Homey.done();
      } catch (error) {
        Homey.alert(error.message || error, 'error');
      } finally {
        Homey.hideLoadingOverlay();
      }
    });
  </script>
</body>
</html>
